services:
  temporal:
    image: temporalio/temporal:latest
    container_name: temporal-dev-server
    command:
      - "server"
      - "start-dev"
      - "--ip"
      - "0.0.0.0"
      - "--port"
      - "7233"
      - "--ui-port"
      - "8233"
      - "--db-filename"
      - "/var/temporal/temporal.db"
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal_data:/var/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    container_name: temporal-wonder-azurite
    command: azurite -l /data --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data

  wiremock:
    image: wiremock/wiremock:3.9.1
    container_name: temporal-wonder-wiremock
    ports:
      - "8080:8080"
    volumes:
      - ./wiremock:/home/wiremock

volumes:
  temporal_data:
  azurite_data:
